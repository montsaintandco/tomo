# master 푸시마다 서버용 이미지를 만들어 ghcr에 올린다. 서버 감시 타이머가 :latest 변화를 보고 Coolify에 배포한다.
# gate(tsc·eslint 오류·순수 테스트)가 실패하면 build 가 돌지 않아 이미지가 안 올라간다. 게이트만 문제면 build 의 needs: gate 한 줄을 뺀다.
# NEXT_PUBLIC_* 는 빌드 때 박히므로 저장소 Actions 변수(vars)에서 읽는다. 비밀값은 Coolify 실행 환경변수에만 둔다.
name: server-image
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "plans/**", "supabase/**", ".agents/**", "**/*.md"]
  workflow_dispatch:
concurrency: { group: server-image, cancel-in-progress: true }
permissions: { contents: read, packages: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
  # T11 DB 테스트 — 이 작업 안에서만 사는 임시 Supabase(로컬 스택)에 0001~ 마이그레이션을 처음부터 재생하고 supabase/seed.sql 을 넣은 뒤 전체 테스트를 돈다.
  # 운영 DB 에는 접속하지 않는다(tests/setup/db-guard.ts 가 CI 에서 127.0.0.1 외 주소를 막는다).
  # 처음 2주(~2026-12-10)는 「실패해도 배포 진행」: continue-on-error 이고 build 의 needs 에 없다(워크플로 결과·smoke 트리거는 성공 유지).
  # 필수로 올릴 때: continue-on-error 줄을 지우고 build 의 needs 를 [gate, db-tests] 로 바꾼다. 되돌릴 때: 이 작업을 통째로 지운다.
  # 마이그레이션은 supabase start 가 아니라 psql 로 넣는다(0013 번호 중복 — docs/aaa/06-db-replay.md).
  db-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: 임시 Supabase 띄우기
        run: |
          mkdir -p "$RUNNER_TEMP/sb"
          mv supabase/migrations supabase/seed.sql "$RUNNER_TEMP/sb/"
          supabase start
      - name: 마이그레이션 0001~ 재생 + 시드
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          for f in $(LC_ALL=C ls "$RUNNER_TEMP"/sb/migrations/*.sql); do
            echo "== $(basename "$f")"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/sb/seed.sql"
          psql "$DB_URL" -q -c "notify pgrst, 'reload schema'"
          sleep 3
      - run: npm install --no-audit --no-fund
      - name: DB 테스트
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          npm test
  build:
    needs: gate
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }} # /api/health version·어드민 시스템 상태. 스모크가 새 배포 도착을 이걸로 안다
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_COMPANY_NAME: ${{ vars.NEXT_PUBLIC_COMPANY_NAME }}
      NEXT_PUBLIC_COMPANY_CEO: ${{ vars.NEXT_PUBLIC_COMPANY_CEO }}
      NEXT_PUBLIC_COMPANY_BIZ_NO: ${{ vars.NEXT_PUBLIC_COMPANY_BIZ_NO }}
      NEXT_PUBLIC_COMPANY_MAIL_ORDER_NO: ${{ vars.NEXT_PUBLIC_COMPANY_MAIL_ORDER_NO }}
      NEXT_PUBLIC_COMPANY_ADDRESS: ${{ vars.NEXT_PUBLIC_COMPANY_ADDRESS }}
      NEXT_PUBLIC_COMPANY_PHONE: ${{ vars.NEXT_PUBLIC_COMPANY_PHONE }}
      NEXT_PUBLIC_COMPANY_EMAIL: ${{ vars.NEXT_PUBLIC_COMPANY_EMAIL }}
      NEXT_PUBLIC_COMPANY_HOURS: ${{ vars.NEXT_PUBLIC_COMPANY_HOURS }}
      NEXT_PUBLIC_COMPANY_PRIVACY_OFFICER: ${{ vars.NEXT_PUBLIC_COMPANY_PRIVACY_OFFICER }}
      NEXT_PUBLIC_COMPANY_RETURN_ADDRESS: ${{ vars.NEXT_PUBLIC_COMPANY_RETURN_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          tags: ghcr.io/montsaintandco/tomo:latest,ghcr.io/montsaintandco/tomo:${{ github.sha }}
