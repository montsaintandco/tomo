# master 푸시마다 서버용 이미지를 만들어 ghcr에 올린다. 서버 감시 타이머가 :latest 변화를 보고 Coolify에 배포한다.
# gate(tsc·eslint 오류·순수 테스트)가 실패하면 build 가 돌지 않아 이미지가 안 올라간다. 게이트만 문제면 build 의 needs: gate 한 줄을 뺀다.
# NEXT_PUBLIC_* 는 빌드 때 박히므로 저장소 Actions 변수(vars)에서 읽는다. 비밀값은 Coolify 실행 환경변수에만 둔다.
name: server-image
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "plans/**", "supabase/**", ".agents/**", "**/*.md"]
  workflow_dispatch:
concurrency: { group: server-image, cancel-in-progress: true }
permissions: { contents: read, packages: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
  # T11 DB 테스트는 .github/workflows/db-tests.yml 로 분리했다(배포 게이트와 무관, 실패해도 배포 진행).
  build:
    needs: gate
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }} # /api/health version·어드민 시스템 상태. 스모크가 새 배포 도착을 이걸로 안다
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_AUCTION: ${{ vars.NEXT_PUBLIC_AUCTION }} # 자체 상품 경매(docs/aaa/14). 끄려면 변수를 지우고 재빌드
      NEXT_PUBLIC_MARKET_AUCTION: ${{ vars.NEXT_PUBLIC_MARKET_AUCTION }} # 해외 마켓 경매 입찰 대행(docs/aaa/15). M6 리허설 전에는 변수를 넣지 않는다(꺼짐)
      NEXT_PUBLIC_COMPANY_NAME: ${{ vars.NEXT_PUBLIC_COMPANY_NAME }}
      NEXT_PUBLIC_COMPANY_CEO: ${{ vars.NEXT_PUBLIC_COMPANY_CEO }}
      NEXT_PUBLIC_COMPANY_BIZ_NO: ${{ vars.NEXT_PUBLIC_COMPANY_BIZ_NO }}
      NEXT_PUBLIC_COMPANY_MAIL_ORDER_NO: ${{ vars.NEXT_PUBLIC_COMPANY_MAIL_ORDER_NO }}
      NEXT_PUBLIC_COMPANY_ADDRESS: ${{ vars.NEXT_PUBLIC_COMPANY_ADDRESS }}
      NEXT_PUBLIC_COMPANY_PHONE: ${{ vars.NEXT_PUBLIC_COMPANY_PHONE }}
      NEXT_PUBLIC_COMPANY_EMAIL: ${{ vars.NEXT_PUBLIC_COMPANY_EMAIL }}
      NEXT_PUBLIC_COMPANY_HOURS: ${{ vars.NEXT_PUBLIC_COMPANY_HOURS }}
      NEXT_PUBLIC_COMPANY_PRIVACY_OFFICER: ${{ vars.NEXT_PUBLIC_COMPANY_PRIVACY_OFFICER }}
      NEXT_PUBLIC_COMPANY_RETURN_ADDRESS: ${{ vars.NEXT_PUBLIC_COMPANY_RETURN_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          tags: ghcr.io/montsaintandco/tomo:latest,ghcr.io/montsaintandco/tomo:${{ github.sha }}
