# CI 임시 Supabase(로컬 스택) 설정 — T11 DB 테스트 전용. 운영 프로젝트 설정이 아니다.
# 마이그레이션·시드는 supabase start 가 아니라 .github/workflows/db-tests.yml이 psql 로 직접 넣는다
# (0013 번호가 두 파일이라 CLI 의 마이그레이션 기록 표에서 버전이 겹친다 → docs/aaa/06-db-replay.md).
project_id = "tomo"

[api]
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[auth.rate_limit]
# 테스트가 파일마다 로그인한다(약 20회). 기본 상한(5분 30회)에 걸리지 않게 올린다
sign_in_sign_ups = 1000

[auth.email]
enable_signup = true
enable_confirmations = false
